[workspace]
members = [
  "crates/vm-contour",
  "crates/vm-core",
  "crates/vm-edge",
  "crates/vm-laser",
  "crates/vm-match",
  "crates/vm-morph",
  "crates/vm-multiscale",
  "crates/vm-pyr",
  "crates/vm-python",
  "crates/vm-segment",
  "crates/vm-shape",
  "crates/vision-metrology",
]
resolver = "3"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
