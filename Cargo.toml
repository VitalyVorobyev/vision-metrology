[workspace]
members = [
  "crates/vm-primitives",
  "crates/vision-metrology",
  "crates/vm-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/vision-metrology"

[workspace.dependencies]
nalgebra = { version = "0.35", features = ["std"] }
criterion = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
