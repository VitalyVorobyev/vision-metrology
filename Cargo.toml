[workspace]
members = [
  "crates/vm-primitives",
  "crates/vision-metrology",
  "crates/vm-python",
]
resolver = "3"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
