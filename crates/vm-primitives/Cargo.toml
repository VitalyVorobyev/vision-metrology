[package]
name = "vm-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core image, geometry, edge, pyramid, and morphology primitives for vision metrology"
keywords = ["machine-vision", "metrology", "image-processing", "edge-detection"]
categories = ["computer-vision", "science"]

[dependencies]
nalgebra = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
## Serde derives on the geometry/config types (Rect2f, SmoothKind) plus
## nalgebra's own, since Point2f/Vec2f are nalgebra aliases. Lets downstream
## model types persist them.
serde = ["dep:serde", "nalgebra/serde-serialize"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "downsample"
harness = false

[[bench]]
name = "edge2d"
harness = false
[[bench]]
name = "edge1d"
harness = false

[[bench]]
name = "morph"
harness = false


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
