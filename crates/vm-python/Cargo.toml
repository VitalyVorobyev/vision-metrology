[package]
name = "vm-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "PyO3 Python bindings for the vision-metrology workspace"
# Distributed as a PyPI wheel via maturin, not as a crates.io crate. Publishing
# it would also put a second `vision_metrology` lib name on the registry.
publish = false

[lib]
name = "vision_metrology"
crate-type = ["cdylib", "rlib"]
# The lib name intentionally matches the `vision-metrology` package's own lib
# name so the Python extension module is importable as `vision_metrology`.
# That collision makes rustdoc see two candidate rlibs for the same extern
# name, so both rustdoc targets must be disabled for this crate.
doc = false
doctest = false

[dependencies]
vm-primitives    = { path = "../vm-primitives" }
vision-metrology = { path = "../vision-metrology" }
pyo3             = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy            = "0.29"

[build-dependencies]
pyo3-build-config = "0.29"

[lints]
workspace = true
