[package]
name = "vm-python"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PyO3 Python bindings for the vision-metrology workspace"

[lib]
name = "vision_metrology"
crate-type = ["cdylib", "rlib"]

[dependencies]
vm-core       = { path = "../vm-core" }
vm-edge       = { path = "../vm-edge" }
vm-match      = { path = "../vm-match" }
vm-shape      = { path = "../vm-shape" }
vm-multiscale = { path = "../vm-multiscale" }
vm-segment    = { path = "../vm-segment" }
vm-contour    = { path = "../vm-contour" }
pyo3          = { version = "0.28", features = ["extension-module", "abi3-py310"] }
numpy         = "0.28"

[build-dependencies]
pyo3-build-config = "0.28"
