[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vision-metrology"
# maturin takes the version from Cargo.toml (`version.workspace = true`), so the wheel and
# the crates cannot drift apart.
dynamic = ["version"]
# Only what the bindings expose: laser stripe extraction is a Rust-only module.
description = "Industrial machine-vision metrology: subpixel edges, shape-based matching, calipers, bead tracking, robust fitting, pixel-to-millimetre calibration, image warping and cross-correlation"
readme = "README.md"
# SPDX expression only: `license-files` cannot reach the repo-root LICENSE-*
# files because `..` is rejected in its globs.
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
keywords = ["machine-vision", "metrology", "image-processing", "edge-detection", "shape-matching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# Every example and test builds its input with numpy and reads results back as
# numpy arrays, so it is a hard runtime requirement, not an extra.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/VitalyVorobyev/vision-metrology"

[tool.maturin]
manifest-path = "Cargo.toml"
# The Rust lib target is `vm_python` (renaming it avoids an output-filename
# collision with the `vision-metrology` crate). The importable Python name is
# set here and by the `#[pymodule] fn vision_metrology`, which decides the
# `PyInit_` symbol.
module-name = "vision_metrology"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
# `python/vision_metrology/` is a mixed Rust/Python package: maturin places the
# compiled extension at `vision_metrology.vision_metrology`, `__init__.py`
# re-exports it, and `__init__.pyi` + `py.typed` ship the hand-written stubs
# (see https://www.maturin.rs/project_layout).
python-source = "python"
