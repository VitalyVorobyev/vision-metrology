[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vision-metrology"
version = "0.1.0"
description = "Python bindings for the vision-metrology workspace"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "vision_metrology"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
