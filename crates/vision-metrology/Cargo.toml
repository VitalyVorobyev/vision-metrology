[package]
name = "vision-metrology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Industrial machine-vision metrology: calipers and metrology models, robust line/circle/ellipse fitting, shape-based object detection, contour graphs, laser stripe extraction, subpixel edges"
keywords = ["machine-vision", "metrology", "laser", "contour", "segmentation"]
categories = ["computer-vision", "science"]

[dependencies]
vm-primitives = { path = "../vm-primitives", version = "0.1.0" }
nalgebra = { workspace = true }
libm = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The standard cross-correlation engine (user decision, corr wave): a
# pyramidal ZNCC/SSD matcher with rotation search and subpixel refinement.
# Optional, tied to the `corr` feature — `corr::CorrTemplate` is a thin
# zero-copy-when-possible adapter over it, not a reimplementation.
corrmatch = { version = "0.2", features = ["simd"], optional = true }

[features]
default = ["contour", "corr", "fit", "laser", "lsd", "matching", "measure", "metric", "scale", "segment", "warp"]

## Junction-aware contour graph from 2-D edgels.
contour = []
## Cross-correlation matching (`CorrTemplate` / `find` / `find_topk`) and
## inter-frame subpixel `displacement`, over the `corrmatch` engine.
corr = ["dep:corrmatch"]
## Robust line / circle / ellipse fitting with reported residuals.
fit = []
## Calipers and metrology models. Measured points are fitted, so this implies `fit`.
measure = ["fit"]
## Laser stripe extraction via opposite-polarity edge pairs.
laser = []
## LSD line-segment detection.
lsd = []
## The calibration bridge: pixel <-> millimetre via a mirrored pinhole +
## Brown-Conrady camera model. `io` (RigExtrinsicsExport / table_calibration
## import) needs JSON parsing, so this implies `dep:serde` + `dep:serde_json`
## without pulling in the versioned-ShapeModel `serde` feature's `matching`
## dependency. `plane_grid_map`/`undistort_map` build a `warp::Map`, so this
## implies `warp`.
metric = ["dep:serde", "dep:serde_json", "warp"]
## Shape-based object detection (ShapeModel / ShapeMatcher). `ShapeMatch`
## rectifies into a canonical crop via `warp::Map`, so this implies `warp`.
matching = ["warp"]
## Scale estimation for `matching` ("estimate-then-verify", roadmap W7):
## `estimate_scale_moments` (segment a blob, compare its size to the taught
## model) and `estimate_scale_logpolar` (log-polar ZNCC correlation over
## `corr` + `warp::Map::log_polar`), plus the `find_scale_invariant`
## convenience wrapper. Implies every module it draws on.
scale = ["corr", "matching", "segment", "warp"]
## Thresholding, CCL, watershed, edgel region growing.
## `segment::grow_regions` consumes a `ContourGraph`, so this implies `contour`.
segment = ["contour"]
## Image warping: `Map::{affine, projective, polar, from_fn}` + `apply`, dst→src
## gather with a first-class validity mask.
warp = []
## Versioned ShapeModel persistence: `save` / `load` and `to_bytes` /
## `from_bytes` over an opaque, version-gated document. Enables the same feature
## in vm-primitives for the geometry types the model embeds.
serde = ["dep:serde", "dep:serde_json", "vm-primitives/serde", "matching"]
## Internal diagnostics: per-level candidate counts on stderr. Dev only.
trace-cands = []

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = { workspace = true }
# Examples read .png fixtures and .bmp frames from industrial cameras. BMP
# costs zero extra transitive crates; the default feature set would add 58
# (rav1e, exr, gif, avif-serialize, ...) to the dev tree for formats no
# example or bench uses.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "build_graph"
harness = false
required-features = ["contour"]

[[bench]]
name = "detect_shape"
harness = false
required-features = ["fit", "lsd"]

[[bench]]
name = "segment"
harness = false
required-features = ["segment"]

[[bench]]
name = "match_shape"
harness = false
required-features = ["matching"]

[[bench]]
name = "extract"
harness = false
required-features = ["laser"]

[[bench]]
name = "measure"
harness = false
required-features = ["measure"]

[[bench]]
name = "warp"
harness = false
required-features = ["warp"]

[[bench]]
name = "corr"
harness = false
required-features = ["corr"]


# Examples and integration tests are auto-discovered, so the gated ones need an
# explicit target entry declaring which module they exercise. Without this,
# `--no-default-features` fails on targets rather than skipping them.

[[example]]
name = "contour_graph"
required-features = ["contour"]

[[example]]
name = "laserline"
required-features = ["laser"]

[[example]]
name = "line_segments"
required-features = ["lsd"]

[[example]]
name = "measure_circles"
required-features = ["contour", "fit"]

[[example]]
name = "segmentation"
required-features = ["segment"]

[[example]]
name = "shape_matching"
required-features = ["matching"]

[[example]]
name = "stage_timing"
required-features = ["matching"]

[[example]]
name = "inspect_canend"
required-features = ["fit", "matching", "measure"]

[[example]]
name = "pose_audit"
required-features = ["corr", "fit", "matching"]

[[example]]
name = "align_crops"
required-features = ["matching", "warp"]

[[example]]
name = "gen_illustrations"
required-features = ["contour", "fit", "laser", "matching", "measure"]

[[example]]
name = "birdseye_mosaic"
required-features = ["metric"]

[[test]]
name = "shape_matching"
required-features = ["matching"]

[[test]]
name = "corr"
required-features = ["corr"]

[[test]]
name = "glue_displacement"
required-features = ["corr"]

[[test]]
name = "corrmatch_bridge"
required-features = ["corr", "matching"]

[[test]]
name = "accuracy"
required-features = ["corr", "fit", "measure", "matching"]

[[test]]
name = "metric_rectify"
required-features = ["matching", "metric"]

[[test]]
name = "mosaic"
required-features = ["metric"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
