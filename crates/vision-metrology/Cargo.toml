[package]
name = "vision-metrology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Industrial machine-vision metrology: contour graphs, laser stripe extraction, multi-scale edges, shape fitting, segmentation, edge-model matching"
keywords = ["machine-vision", "metrology", "laser", "contour", "segmentation"]
categories = ["computer-vision", "science"]

[dependencies]
vm-primitives = { path = "../vm-primitives", version = "0.1.0" }
nalgebra = { workspace = true }
libm = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
## Versioned ShapeModel persistence (`ShapeModel::to_json` / `from_json`) plus
## Serialize/Deserialize derives on the model types. Enables the same feature
## in vm-primitives for the geometry types the model embeds.
serde = ["dep:serde", "dep:serde_json", "vm-primitives/serde"]

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = { workspace = true }
# Examples read .png fixtures and .bmp frames from industrial cameras. BMP
# costs zero extra transitive crates; the default feature set would add 58
# (rav1e, exr, gif, avif-serialize, ...) to the dev tree for formats no
# example or bench uses.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "build_graph"
harness = false

[[bench]]
name = "detect_multiscale"
harness = false

[[bench]]
name = "detect_shape"
harness = false

[[bench]]
name = "segment"
harness = false

[[bench]]
name = "match_shape"
harness = false

[[bench]]
name = "extract"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
