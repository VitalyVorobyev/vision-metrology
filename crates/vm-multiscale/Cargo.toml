[package]
name = "vm-multiscale"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Multi-scale edge detection combining vm-pyr pyramid with vm-edge detector"

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
vm-core = { path = "../vm-core" }
vm-pyr  = { path = "../vm-pyr" }
vm-edge = { path = "../vm-edge" }
rayon   = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "detect"
harness = false

[lints]
workspace = true
