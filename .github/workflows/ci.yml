name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-invariants:
    name: Invariant numbering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Invariant numbers in docs/system-design.md are cited by number from source
      # files and docs, and nothing in the compiler checks them. This does.
      - name: Check invariant numbering and citations
        run: python3 tools/check-invariants.py

  rust-quality:
    name: Rust Quality (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # Also runs on push-to-main in publish-docs.yml, but a broken intra-doc
      # link must fail the PR rather than the deploy that follows the merge.
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Feature matrix (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Every domain module in vision-metrology is opt-in. Building only
      # `--all-features` would never catch a `#[cfg]` that forgot a gated
      # import, so check each feature alone and the empty set too.
      - name: Check each feature
        run: cargo hack clippy -p vision-metrology --each-feature --all-targets -- -D warnings

      - name: Check vm-primitives features
        run: cargo hack clippy -p vm-primitives --feature-powerset --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # Keep in step with `rust-version` in the root Cargo.toml. Currently set
      # by nalgebra 0.35 rather than by anything in this workspace.
      MSRV: 1.91.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.MSRV }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # `+toolchain` takes precedence over rust-toolchain.toml, which otherwise
      # pins this step back to stable and silently defeats the check.
      - name: Check
        run: cargo +${{ env.MSRV }} check --workspace --all-targets --all-features

  examples:
    name: Examples (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Every example below asserts its own output, so this is a real
      # end-to-end check of the algorithms rather than a build smoke test.
      # `laserline` is excluded: it takes a path to an image that is not in
      # the repository.
      - name: Run self-asserting examples
        run: |
          set -euo pipefail
          for ex in contour_graph edge_1d edge_2d line_segments measure_circles \
                    morphology pyramid segmentation shape_matching; do
            echo "::group::$ex"
            cargo run --release -p vision-metrology --example "$ex"
            echo "::endgroup::"
          done

  python:
    name: Python bindings (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: pip install --upgrade maturin pytest numpy

      # python-wheels.yml publishes to PyPI without ever importing what it
      # built. This is the job that actually exercises the extension module.
      - name: Build and install the extension module
        run: pip install crates/vm-python

      - name: Test
        run: pytest crates/vm-python/tests -q

  cross-build:
    name: Cross-platform Build/Test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

  lab:
    name: Lab (frontend + desktop shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lab/frontend/src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # @vitavision/lab-ui is a published package, so there is nothing to check
      # out beside this repo and nothing to build first. While it was a
      # `file:../../../lab-ui` path dependency this job was not possible without
      # cloning a sibling repo, which is most of why the lab had no CI at all.
      - name: Install frontend dependencies
        working-directory: lab/frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: lab/frontend
        run: bun run typecheck

      - name: Test
        working-directory: lab/frontend
        run: bun run test

      - name: Build
        working-directory: lab/frontend
        run: bun run build

      # The desktop shell is a standalone cargo workspace (see its Cargo.toml),
      # so `--workspace` in the jobs above never reaches it. Its GUI dependencies
      # need the system webkit packages even for `cargo test`, which only touches
      # the command layer.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Desktop shell — format
        working-directory: lab/frontend/src-tauri
        run: cargo fmt --all --check

      - name: Desktop shell — lint
        working-directory: lab/frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Includes tests/contract_parity.rs, the desktop-side replay of the
      # committed fixtures — the gate that keeps the two shells numerically
      # in step. tests/folder_flow.rs skips itself here (no private dataset).
      - name: Desktop shell — test
        working-directory: lab/frontend/src-tauri
        run: cargo test
