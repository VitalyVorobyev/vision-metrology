<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>visual-metrology-lab</title>
    <script>
      // Duplicated from @vitavision/lab-ui's theme.ts on purpose — must stay in agreement
      // with it. The class has to be on <html> before first paint, before any module has
      // loaded, or there is a flash of the wrong palette on every load.
      //
      // The key must match `shell/theme.ts`'s LAB_THEME_STORAGE_KEY, which is what the
      // ThemeToggle writes. It did not: this read "vitavision-theme" while the toggle wrote
      // "metrology-lab-theme", so a dark-mode user got a light flash on every start and a
      // reload could come back in the palette they had just changed away from.
      (function () {
        try {
          var stored = localStorage.getItem("metrology-lab-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {
          // Storage unavailable: fall through to the light palette defined on :root.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
