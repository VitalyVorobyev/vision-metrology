[project]
name = "vm-lab"
version = "0.1.0"
description = "Visual Metrology Lab — local workbench over the vision_metrology package"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow>=11.0",
    "numpy>=2.0",
    "python-multipart>=0.0.17",
    "vision-metrology",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_lab"]

[tool.uv.sources]
# Prefer an editable path dependency on the sibling crate. `uv` resolves this through
# maturin's PEP 517 hooks; if that ever fights uv's resolver in this environment, build a
# wheel once with `maturin build -m ../../crates/vm-python/Cargo.toml --release` and point
# this at `{ path = "...", ... }` for the built wheel file instead — see lab/README.md.
vision-metrology = { path = "../../crates/vm-python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
